name: Sync Feeds

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: rss-sync-feeds
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync feeds
        run: python -m src.main --sync

      - name: Validate feeds.toml
        run: |
          python - <<'PY'
          import subprocess
          import tomllib
          from pathlib import Path

          def count(data: dict) -> int:
              return sum(len(cat.get("feed", [])) for cat in data.get("category", []))

          new = tomllib.loads(Path("feeds.toml").read_text(encoding="utf-8"))
          old_text = subprocess.check_output(
              ["git", "show", "HEAD:feeds.toml"], text=True
          )
          old = tomllib.loads(old_text)
          new_count, old_count = count(new), count(old)
          print(f"feeds: {old_count} -> {new_count}")
          if new_count == 0 or (old_count and new_count < old_count * 0.5):
              raise SystemExit("feeds.toml shrank unexpectedly; refusing to commit")
          PY

      - name: Commit feeds.toml
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds.toml
          if git diff --cached --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git commit -m "chore: sync feeds $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main
