name: RSS Collection & Classification

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: rss-collect
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  collect:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime data from data branch
        run: |
          set -euo pipefail
          rm -f .restore-data-ok
          mkdir -p .data

          data_heads=""
          data_rc=0
          data_heads="$(git ls-remote --exit-code --heads origin data 2>/dev/null)" || data_rc=$?
          if [ "$data_rc" -eq 0 ] && [ -n "$data_heads" ]; then
            if ! git fetch --depth=1 origin data; then
              echo "::error::data branch exists but could not be fetched"
              exit 1
            fi
            git archive FETCH_HEAD | tar -x -C .data
            for f in state.json articles.json status.json; do
              if [ -f ".data/$f" ]; then
                cp ".data/$f" "./$f"
                echo "Restored $f from data branch"
              fi
            done
            # Backward compatibility for the pre-ADR-015 layout.
            if [ ! -f articles.json ] && [ -f .data/cache.json ]; then
              cp .data/cache.json articles.json
              echo "Migrated .data/cache.json to articles.json"
            fi
          elif [ "$data_rc" -eq 2 ] || { [ "$data_rc" -eq 0 ] && [ -z "$data_heads" ]; }; then
            echo "::warning::data branch not found; starting with empty runtime state"
          else
            echo "::error::could not query data branch (git ls-remote rc=$data_rc)"
            exit 1
          fi

          # Backward compatibility for the first run after ADR-015. The old
          # gh-pages layout held state.json/articles.json next to output/.
          # Migrate them on the fly so a deployment does not lose the backlog.
          if [ ! -f state.json ] || [ ! -f articles.json ]; then
            site_heads=""
            site_rc=0
            site_heads="$(git ls-remote --exit-code --heads origin gh-pages 2>/dev/null)" || site_rc=$?
            if [ "$site_rc" -eq 0 ] && [ -n "$site_heads" ]; then
              if ! git fetch --depth=1 origin gh-pages; then
                echo "::error::gh-pages exists but could not be fetched for legacy runtime data"
                exit 1
              fi
              mkdir -p .legacy
              for f in state.json articles.json cache.json; do
                if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
                  git show "FETCH_HEAD:$f" > ".legacy/$f"
                fi
              done
              if [ ! -f state.json ] && [ -f .legacy/state.json ]; then
                cp .legacy/state.json state.json
                echo "::warning::restored legacy state.json from gh-pages"
              fi
              if [ ! -f articles.json ]; then
                if [ -f .legacy/articles.json ]; then
                  cp .legacy/articles.json articles.json
                  echo "::warning::restored legacy articles.json from gh-pages"
                elif [ -f .legacy/cache.json ]; then
                  cp .legacy/cache.json articles.json
                  echo "::warning::migrated legacy cache.json from gh-pages"
                fi
              fi
            elif [ "$site_rc" -ne 2 ] && ! { [ "$site_rc" -eq 0 ] && [ -z "$site_heads" ]; }; then
              echo "::error::could not query gh-pages for legacy runtime data (rc=$site_rc)"
              exit 1
            fi
          fi

          # Never run with a corrupt cache: it would be silently treated as
          # empty and then force-pushed over the data branch.
          for f in state.json articles.json; do
            if [ -f "$f" ]; then
              if ! python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
                echo "::error::$f is not valid JSON; refusing to start"
                exit 1
              fi
            fi
          done

          if [ "$data_rc" -eq 0 ] && [ -n "$data_heads" ] \
              && [ ! -f state.json ] && [ ! -f articles.json ]; then
            echo "::error::data branch exists but contains no state.json/articles.json"
            exit 1
          fi

          touch .restore-data-ok

      - name: Restore output from gh-pages
        run: |
          set -euo pipefail
          rm -f .restore-site-ok
          mkdir -p output

          site_heads=""
          site_rc=0
          site_heads="$(git ls-remote --exit-code --heads origin gh-pages 2>/dev/null)" || site_rc=$?
          if [ "$site_rc" -eq 0 ] && [ -n "$site_heads" ]; then
            if ! git fetch --depth=1 origin gh-pages; then
              echo "::error::gh-pages exists but could not be fetched"
              exit 1
            fi
            if git cat-file -e FETCH_HEAD:output 2>/dev/null; then
              git archive FETCH_HEAD output | tar -x -C .
              echo "Restored $(find output -name '*.md' | wc -l) output files"
            else
              echo "::warning::gh-pages has no output/ directory; starting with empty output"
            fi
          elif [ "$site_rc" -eq 2 ] || { [ "$site_rc" -eq 0 ] && [ -z "$site_heads" ]; }; then
            echo "::warning::gh-pages branch not found; starting with empty output"
          else
            echo "::error::could not query gh-pages (rc=$site_rc)"
            exit 1
          fi

          touch .restore-site-ok

      - name: Fetch RSS
        run: python -m src.main --fetch

      - name: Classify articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.main --classify

      - name: Cleanup old articles
        run: python -m src.main --cleanup

      - name: Generate run report
        if: always()
        run: python -m src.main --report

      - name: Prepare Pages content
        run: |
          set -euo pipefail
          rm -rf _build
          cp -R output _build
          if [ -f _build/index.md ]; then
            sed -i 's/\.md)/.html)/g' _build/index.md
          fi

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_build
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # Run after deploy so a backlog/freshness contract breach alerts the
      # maintainer without blocking publication of already-valid content.
      - name: Verify runtime contract
        if: always()
        run: python -m src.main --check

      - name: Persist runtime data to data branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -f .data-push-ok
          if [ ! -f .restore-data-ok ]; then
            echo "::warning::runtime restore did not succeed; skipping data branch push"
            exit 0
          fi
          if [ ! -f state.json ] || [ ! -f articles.json ]; then
            echo "::warning::state.json or articles.json is missing; skipping data branch push"
            exit 0
          fi
          for f in state.json articles.json; do
            if ! python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; then
              echo "::error::$f is not valid JSON; skipping data branch push"
              exit 0
            fi
          done

          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf .data-push

          if git clone --depth 1 --branch data "$REMOTE" .data-push 2>/dev/null; then
            echo "Cloned existing data branch"
          elif DATA_HEADS="$(git ls-remote --heads "$REMOTE" data 2>/dev/null)" && [ -z "$DATA_HEADS" ]; then
            echo "data branch does not exist; creating it"
            mkdir -p .data-push
            git -C .data-push init
            git -C .data-push checkout --orphan data
            git -C .data-push remote add origin "$REMOTE"
          else
            echo "::error::data branch exists but could not be cloned"
            exit 1
          fi

          cp -f state.json articles.json .data-push/
          if [ -f status.json ]; then
            cp -f status.json .data-push/
          else
            rm -f .data-push/status.json
          fi
          # The data branch is a runtime snapshot; cache.json is no longer part of it.
          rm -f .data-push/cache.json

          cd .data-push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No runtime data changes"
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push --force origin data
          fi
          cd ..
          touch .data-push-ok

      - name: Persist site output to gh-pages
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f .restore-site-ok ]; then
            echo "::warning::site restore did not succeed; skipping gh-pages push"
            exit 0
          fi
          if [ ! -d output ]; then
            echo "::warning::output directory is missing; skipping gh-pages push"
            exit 0
          fi

          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf .site-push

          if git clone --depth 1 --branch gh-pages "$REMOTE" .site-push 2>/dev/null; then
            echo "Cloned existing gh-pages branch"
          elif SITE_HEADS="$(git ls-remote --heads "$REMOTE" gh-pages 2>/dev/null)" && [ -z "$SITE_HEADS" ]; then
            echo "gh-pages branch does not exist; creating it"
            mkdir -p .site-push
            git -C .site-push init
            git -C .site-push checkout --orphan gh-pages
            git -C .site-push remote add origin "$REMOTE"
          else
            echo "::error::gh-pages branch exists but could not be cloned"
            exit 1
          fi

          rm -rf .site-push/output
          cp -R output .site-push/output
          # gh-pages is the rendered-output snapshot only; runtime state lives
          # on data. Only delete legacy runtime files after the data snapshot
          # was pushed successfully, otherwise they are the only recovery copy.
          if [ -f .data-push-ok ]; then
            rm -f .site-push/state.json .site-push/articles.json .site-push/status.json .site-push/cache.json
          else
            echo "::warning::data snapshot not persisted; keeping legacy runtime files on gh-pages"
          fi

          cd .site-push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site output changes"
          else
            git commit -m "site: snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push --force origin gh-pages
          fi
