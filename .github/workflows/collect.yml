name: RSS Collection & Classification

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      snapshot:
        description: "Force an archive snapshot to the data branch"
        type: boolean
        default: false

concurrency:
  group: rss-collect
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  collect:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: github-pages
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The cache is a hot copy of the durable archive and runtime metadata.
      # It is not the source of truth: the data branch is. A cache miss now
      # restores the append-only Markdown archive and feed indexes, so bodies
      # are no longer lost when GitHub evicts the cache.
      - name: Restore runtime cache
        id: runtime-cache
        # A cache outage must not block collection: the data branch is the
        # fallback. Invalid/partial restores are rejected by the next step.
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: .runtime
          key: rss-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            rss-runtime-

      - name: Restore runtime data
        env:
          CACHE_HIT: ${{ steps.runtime-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.runtime-cache.outputs.cache-matched-key }}
          CACHE_OUTCOME: ${{ steps.runtime-cache.outcome }}
        run: |
          set -euo pipefail
          rm -f .restore-data-ok .cache-restore-miss
          rm -rf .data .legacy .backfill
          mkdir -p output

          validate_json() {
            python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$1"
          }
          has_daily_archive() {
            [ -n "$(find archive -type f -name '*.md' -print -quit 2>/dev/null)" ]
          }

          if [ "${CACHE_OUTCOME}" = "failure" ]; then
            echo "::warning::runtime cache restore action failed; treating it as a cold start"
            rm -rf .runtime
          fi

          # cache-hit is "true" only for an exact key match. The key contains
          # run_id + run_attempt, so a normal run restores a previous cache through
          # restore-keys and reports a partial match. Treat validated files as
          # authoritative, and log the exact/partial state for debugging.
          cache_ok=false
          # Accept both the split state files and the pre-split legacy names.
          # A cache written by an older run has state.json/articles.json only.
          cache_feed_state=""
          cache_article_state=""
          if [ -f .runtime/feed_state.json ]; then
            cache_feed_state=.runtime/feed_state.json
          elif [ -f .runtime/state.json ]; then
            cache_feed_state=.runtime/state.json
          fi
          if [ -f .runtime/article_state.json ]; then
            cache_article_state=.runtime/article_state.json
          elif [ -f .runtime/articles.json ]; then
            cache_article_state=.runtime/articles.json
          fi
          if [ -n "$cache_feed_state" ] && [ -n "$cache_article_state" ]; then
            if validate_json "$cache_feed_state" && validate_json "$cache_article_state"; then
              cache_ok=true
              # Metadata validity alone is not enough: archive refs must point
              # at files in this cache, and an archive with articles must have
              # feed indexes (annotations live there). Article rows are either
              # the versioned {"v": 1, "articles": [...]} object or a legacy
              # bare list.
              if ! python - "$cache_article_state" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(".runtime")
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if isinstance(data, dict):
              rows = data.get("articles")
          elif isinstance(data, list):
              rows = data
          else:
              rows = None
          if not isinstance(rows, list):
              print("cache article metadata is neither a list nor an articles object")
              sys.exit(1)
          for article in rows:
              if not isinstance(article, dict):
                  continue
              file = article.get("archive_file")
              if file and not (root / file).is_file():
                  print(f"missing archive file referenced by cache: {file}")
                  sys.exit(1)
          archive = root / "archive"
          feeds = root / "feeds"
          has_archive = archive.is_dir() and any(archive.rglob("*.md"))
          has_feeds = feeds.is_dir() and any(feeds.glob("*.jsonl"))
          if has_archive and not has_feeds:
              print("cache has archive but no feed indexes")
              sys.exit(1)
          PY
              then
                cache_ok=false
                echo "::warning::runtime cache is inconsistent with its archive; falling back to the data branch"
              fi
            else
              echo "::warning::runtime cache is not valid JSON; falling back to the data branch"
            fi
          fi

          if [ "$cache_ok" = true ]; then
            cp -a .runtime/. .
            echo "Restored runtime from Actions cache (cache-hit=${CACHE_HIT:-false}, matched-key=${CACHE_MATCHED_KEY:-none})"
          else
            echo "::warning::runtime cache missing or invalid; restoring from the data branch"
            # A cache miss means persisted ETags cannot be trusted as a live
            # cache. Force a full 14-day fetch. Pending metadata is preserved:
            # the durable archive and feed indexes restore its bodies.
            touch .cache-restore-miss
            echo "RSS_FORCE_FETCH=1" >> "$GITHUB_ENV"

            data_rc=0
            data_heads=""
            data_heads="$(git ls-remote --exit-code --heads origin data 2>/dev/null)" || data_rc=$?
            if [ "$data_rc" -eq 0 ] && [ -n "$data_heads" ]; then
              if ! git fetch --depth=1 origin data; then
                echo "::error::data branch exists but could not be fetched"
                exit 1
              fi
              rm -rf .data
              mkdir -p .data
              if ! git archive FETCH_HEAD | tar -x -C .data; then
                echo "::error::data branch exists but its tree could not be extracted"
                exit 1
              fi

              # Metadata is replaced by the snapshot; archive/ and feeds/ are
              # durable append-only trees. output/ is legacy-only: it is still
              # restored for compatibility with old snapshots, but new
              # snapshots no longer contain it. New and legacy metadata names
              # are both copied, and a normalisation step below writes the split
              # files when only the legacy ones exist.
              for f in feed_state.json article_state.json state.json articles.json status.json; do
                if [ -f ".data/$f" ]; then
                  cp ".data/$f" "./$f"
                fi
              done
              for d in archive feeds output; do
                if [ -d ".data/$d" ]; then
                  rm -rf "$d"
                  cp -R ".data/$d" "$d"
                fi
              done

              if { [ ! -f feed_state.json ] && [ ! -f state.json ]; } \
                || { [ ! -f article_state.json ] && [ ! -f articles.json ]; }; then
                echo "::error::data branch exists but has no feed/article metadata (feed_state.json|state.json and article_state.json|articles.json)"
                exit 1
              fi
              # Validate before deleting the extracted tree so corruption on
              # the snapshot branch is reported instead of silently ignored.
              for f in feed_state.json article_state.json state.json articles.json; do
                if [ -f "$f" ] && ! validate_json "$f"; then
                  echo "::error::restored $f is not valid JSON; refusing to start"
                  exit 1
                fi
              done
              if [ -f status.json ] && ! validate_json status.json; then
                echo "::warning::restored status.json is not valid JSON; ignoring derived status"
              fi

              if ! has_daily_archive; then
                if [ -d archive ] && [ -n "$(find archive -maxdepth 1 -type f -name '*.jsonl' -print -quit 2>/dev/null)" ]; then
                  echo "::warning::data branch uses the old ADR-016 metadata archive (archive/*.jsonl); a one-time backfill will create the Markdown archive"
                else
                  echo "::warning::data branch has no Markdown archive; a one-time backfill will run if legacy raw articles are available"
                fi
                if [ ! -d feeds ]; then
                  echo "::warning::data branch has no feeds/ indexes; they will be built during backfill or the next fetch"
                fi
              fi

              echo "Restored feed/article metadata (new or legacy names) plus archive/feeds from data branch (legacy output restored if present)"
              rm -rf .data
            elif [ "$data_rc" -eq 2 ] || { [ "$data_rc" -eq 0 ] && [ -z "$data_heads" ]; }; then
              # One-time migration path for the pre-ADR-016 layout. Raw
              # articles are copied to .legacy/ only as input for src.backfill;
              # they are never restored directly into articles.json.
              echo "::warning::data branch not found; checking legacy gh-pages for a one-time migration"
              site_rc=0
              site_heads=""
              site_heads="$(git ls-remote --exit-code --heads origin gh-pages 2>/dev/null)" || site_rc=$?
              if [ "$site_rc" -eq 0 ] && [ -n "$site_heads" ]; then
                if ! git fetch --depth=1 origin gh-pages; then
                  echo "::warning::gh-pages exists but could not be fetched; starting without legacy state"
                else
                  if git cat-file -e "FETCH_HEAD:state.json" 2>/dev/null; then
                    git show "FETCH_HEAD:state.json" > state.json
                    echo "::warning::restored legacy state.json from gh-pages"
                  fi
                  if git cat-file -e "FETCH_HEAD:output" 2>/dev/null; then
                    rm -rf output
                    git archive FETCH_HEAD output | tar -x -C .
                    echo "::warning::restored legacy output/ from gh-pages"
                  fi
                  mkdir -p .legacy
                  if git cat-file -e "FETCH_HEAD:articles.json" 2>/dev/null; then
                    git show "FETCH_HEAD:articles.json" > .legacy/articles.json
                    echo "::warning::captured legacy articles.json for a one-time Markdown backfill"
                  elif git cat-file -e "FETCH_HEAD:cache.json" 2>/dev/null; then
                    git show "FETCH_HEAD:cache.json" > .legacy/articles.json
                    echo "::warning::captured legacy cache.json for a one-time Markdown backfill"
                  fi
                fi
              elif [ "$site_rc" -eq 2 ] || { [ "$site_rc" -eq 0 ] && [ -z "$site_heads" ]; }; then
                echo "::warning::no data or gh-pages branch found; starting with empty runtime state"
              else
                echo "::error::could not query gh-pages for legacy migration (rc=$site_rc)"
                exit 1
              fi
            else
              echo "::error::could not query data branch (git ls-remote rc=$data_rc)"
              exit 1
            fi
          fi

          # Never run with corrupt metadata: it would be silently treated as
          # empty and then written back over the data branch. New and legacy
          # names are both checked; the normalisation step below reads them.
          for f in feed_state.json article_state.json state.json articles.json status.json; do
            if [ -f "$f" ]; then
              if ! validate_json "$f"; then
                echo "::error::$f is not valid JSON; refusing to start"
                exit 1
              fi
            fi
          done

          echo "Runtime files restored (cache_ok=$cache_ok)"

      # Split the legacy state.json/articles.json pair into the durable
      # feed_state.json/article_state.json files before any archive work. The
      # loaders fall back to the legacy names, so this also runs when only one
      # pair was restored.
      - name: Migrate runtime state
        run: |
          set -euo pipefail
          validate_json() {
            python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$1"
          }

          python -m src.migrate_state

          for f in feed_state.json article_state.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing after state migration; refusing to run"
              exit 1
            fi
            if ! validate_json "$f"; then
              echo "::error::$f is not valid JSON after state migration; refusing to run"
              exit 1
            fi
          done

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          feed = json.loads(Path("feed_state.json").read_text(encoding="utf-8"))
          if not isinstance(feed, dict) or not isinstance(feed.get("feeds", {}), dict):
              sys.exit("feed_state.json does not contain a feeds object")

          article = json.loads(Path("article_state.json").read_text(encoding="utf-8"))
          if isinstance(article, dict):
              rows = article.get("articles")
          elif isinstance(article, list):
              rows = article
          else:
              rows = None
          if not isinstance(rows, list):
              sys.exit("article_state.json does not contain an articles array")

          print(
              f"state migration: {len(feed.get('feeds', {}))} feed(s), "
              f"{len(rows)} article row(s)"
          )
          PY

      # A cache hit from the old architecture may carry raw bodies but no
      # Markdown archive; a data branch may be the ADR-016 metadata-only
      # snapshot. In both cases migrate once from a legacy raw articles.json.
      - name: Migrate legacy articles into Markdown archive
        run: |
          set -euo pipefail
          has_daily_archive() {
            [ -n "$(find archive -type f -name '*.md' -print -quit 2>/dev/null)" ]
          }
          articles_have_bodies() {
            python - "$1" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, ValueError):
              sys.exit(1)
          if isinstance(data, dict):
              rows = data.get("articles")
          elif isinstance(data, list):
              rows = data
          else:
              rows = None
          if not isinstance(rows, list):
              sys.exit(1)
          has_body = any(
              isinstance(item, dict) and (item.get("content") or "").strip()
              for item in rows
          )
          sys.exit(0 if has_body else 1)
          PY
          }
          normalize_articles() {
            # src.backfill expects a bare JSON array. Accept the versioned
            # {"v": 1, "articles": [...]} object as well and write a bare list.
            python - "$1" "$2" <<'PY'
          import json
          import sys
          from pathlib import Path

          try:
              data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, ValueError):
              sys.exit(1)
          if isinstance(data, dict):
              rows = data.get("articles")
          elif isinstance(data, list):
              rows = data
          else:
              rows = None
          if not isinstance(rows, list):
              sys.exit(1)
          Path(sys.argv[2]).write_text(
              json.dumps(rows, ensure_ascii=False), encoding="utf-8"
          )
          PY
          }

          if has_daily_archive; then
            echo "Markdown archive already present; no legacy backfill needed"
            # Feed indexes are derived data. If they are completely missing
            # (for example a partial cache that kept archive/ but lost feeds/),
            # rebuild them from the archive before continuing. There are no
            # annotation records to lose when the directory is empty.
            if [ -z "$(find feeds -type f -name '*.jsonl' -print -quit 2>/dev/null)" ]; then
              echo "::warning::archive present but feeds/ is empty; rebuilding feed indexes"
              if ! python -m src.md_archive --rebuild-indexes archive --feeds feeds; then
                echo "::error::could not rebuild feed indexes from the archive"
                exit 1
              fi
            fi
            rm -rf .legacy
            exit 0
          fi

          raw_source=""
          # 1. A cache/data branch may predate the Markdown archive and still
          #    contain raw bodies. Legacy articles.json is checked first:
          #    state migration strips bodies before writing article_state.json.
          if [ -f articles.json ] && articles_have_bodies articles.json; then
            mkdir -p .backfill
            if normalize_articles articles.json .backfill/legacy-input.json; then
              raw_source=.backfill/legacy-input.json
              echo "Found raw bodies in the restored legacy articles.json; backfilling"
            else
              echo "::warning::legacy articles.json could not be normalised for backfill; ignoring it"
            fi
          elif [ -f article_state.json ] && articles_have_bodies article_state.json; then
            mkdir -p .backfill
            if normalize_articles article_state.json .backfill/legacy-input.json; then
              raw_source=.backfill/legacy-input.json
              echo "Found raw bodies in article_state.json; backfilling from a normalised copy"
            else
              echo "::warning::article_state.json could not be normalised for backfill; ignoring it"
            fi
          fi
          # 2. A legacy gh-pages capture from the restore step.
          if [ -z "$raw_source" ] && [ -f .legacy/articles.json ]; then
            mkdir -p .backfill
            if normalize_articles .legacy/articles.json .backfill/legacy-input.json; then
              raw_source=.backfill/legacy-input.json
              echo "Using legacy articles captured from gh-pages for backfill"
            else
              echo "::warning::legacy gh-pages articles.json is not a valid article state; ignoring it"
            fi
          fi
          # 3. The data branch restored only metadata, but gh-pages may still
          #    have a raw copy. Fetch it once, best-effort.
          if [ -z "$raw_source" ]; then
            site_rc=0
            site_heads=""
            site_heads="$(git ls-remote --exit-code --heads origin gh-pages 2>/dev/null)" || site_rc=$?
            if [ "$site_rc" -eq 0 ] && [ -n "$site_heads" ]; then
              if git fetch --depth=1 origin gh-pages; then
                mkdir -p .legacy .backfill
                for name in articles.json cache.json; do
                  if git cat-file -e "FETCH_HEAD:$name" 2>/dev/null; then
                    git show "FETCH_HEAD:$name" > .legacy/articles.json
                    if normalize_articles .legacy/articles.json .backfill/legacy-input.json; then
                      raw_source=.backfill/legacy-input.json
                      echo "Fetched legacy $name from gh-pages for one-time backfill"
                    else
                      echo "::warning::legacy gh-pages $name is not a valid article state; ignoring it"
                      rm -f .legacy/articles.json
                    fi
                    break
                  fi
                done
              else
                echo "::warning::gh-pages exists but could not be fetched for legacy backfill"
              fi
            elif [ "$site_rc" -eq 2 ] || { [ "$site_rc" -eq 0 ] && [ -z "$site_heads" ]; }; then
              echo "No legacy gh-pages branch; nothing to backfill"
            else
              echo "::warning::could not query gh-pages for legacy backfill (rc=$site_rc)"
            fi
          fi

          if [ -n "$raw_source" ]; then
            # Feed indexes are derived data. If the Markdown archive is
            # missing, existing indexes may point at dead offsets; drop them
            # so backfill cannot skip records as "already indexed".
            if ! has_daily_archive; then
              echo "::warning::dropping stale feed indexes before archive backfill"
              rm -rf feeds
              mkdir -p feeds
            fi
            mkdir -p .backfill
            # The CLI is idempotent: existing feed-index links/guids are
            # skipped, so a retried migration never duplicates archive records.
            python -m src.backfill \
              --articles "$raw_source" \
              --root . \
              --feeds feeds \
              --out .backfill/articles.json

            # Keep pending metadata from the restored snapshot, but attach the
            # archive offsets produced by the backfill. Records that only exist
            # in the legacy file are appended as pending.
            python - <<'PY'
          from src.article_state import archive_fields, article_keys, load_articles, save_articles

          existing = load_articles("article_state.json")
          migrated = load_articles(".backfill/articles.json")
          by_key = {}
          for record in migrated:
              for key in article_keys(record):
                  by_key.setdefault(key, record)

          used = set()
          merged = []
          for record in existing:
              match = next(
                  (by_key[key] for key in article_keys(record) if key in by_key),
                  None,
              )
              if match is not None:
                  record.update(archive_fields(match))
                  # Keep the restored status/attempts/classification but fill
                  # genuinely missing feed metadata from the migration.
                  for field in (
                      "guid",
                      "feed_id",
                      "feed_url",
                      "site_url",
                      "feed_title",
                      "canonical",
                      "title",
                      "author",
                      "published",
                  ):
                      if not record.get(field) and match.get(field):
                          record[field] = match[field]
                  used.add(id(match))
              merged.append(record)
          for record in migrated:
              if id(record) not in used:
                  merged.append(record)
          save_articles(merged, "article_state.json")
          print(f"backfill merge: {len(existing)} existing, {len(migrated)} migrated, {len(merged)} total")
          PY
            rm -rf .backfill
            echo "Backfill complete: Markdown archive and feed indexes created"
          else
            echo "::warning::no Markdown archive and no legacy raw articles; bodies will be fetched again"
            echo "RSS_FORCE_FETCH=1" >> "$GITHUB_ENV"
            # Stale indexes would make fetch skip links whose archive records
            # no longer exist. They are derived and can be rebuilt.
            rm -rf feeds
            mkdir -p feeds
            # Stale archive refs would make fetch skip these rows. Drop only
            # the refs so the forced fetch can archive the bodies again; the
            # pending metadata itself is preserved.
            python - <<'PY'
          from src.article_state import STATUS_CLASSIFIED, STATUS_SKIPPED, STATUS_UNCLASSIFIED, load_articles, save_articles

          done = {STATUS_CLASSIFIED, STATUS_SKIPPED, STATUS_UNCLASSIFIED}
          articles = load_articles("article_state.json")
          changed = False
          for article in articles:
              if article.get("status") in done:
                  continue
              for field in (
                  "archive_file",
                  "archive_offset",
                  "archive_length",
                  "archive_body_len",
                  "archive_sha256",
              ):
                  if field in article:
                      article.pop(field, None)
                      changed = True
          if changed:
              save_articles(articles, "article_state.json")
              print("stripped stale archive refs from pending metadata")
          PY
          fi
          rm -rf .legacy

      - name: Validate runtime archive
        run: |
          set -euo pipefail
          validate_json() {
            python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$1"
          }
          for f in feed_state.json article_state.json; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing; refusing to run"
              exit 1
            fi
            if ! validate_json "$f"; then
              echo "::error::$f is not valid JSON; refusing to run"
              exit 1
            fi
          done
          # Legacy names may survive a data-branch restore. They are no longer
          # authoritative; report corruption but do not fail on it.
          for f in state.json articles.json status.json; do
            if [ -f "$f" ] && ! validate_json "$f"; then
              echo "::warning::legacy $f is not valid JSON; ignoring it"
            fi
          done

          if [ -n "$(find archive -type f -name '*.md' -print -quit 2>/dev/null)" ]; then
            # Repair only incomplete trailing records, then fail closed if any
            # checksum/framing error remains.
            if ! python -m src.md_archive --repair archive; then
              echo "::warning::archive tail repair reported an error; validating anyway"
            fi
            if ! python -m src.md_archive --validate archive; then
              echo "::error::Markdown archive is invalid after tail repair; refusing to run"
              exit 1
            fi
          else
            echo "::warning::no daily Markdown archive yet (first run or migration pending)"
          fi

          # Cold starts are the only place where offsets may have drifted
          # (partial cache, missing daily file). Validate every article ref
          # once, drop stale feed records/annotations, and clear dead refs in
          # metadata so fetch can re-archive the bodies.
          if [ -f .cache-restore-miss ] && [ -d feeds ]; then
            # Non-lossy: append archive records missing from feed indexes while
            # preserving every existing record and annotation.
            if ! python -m src.md_archive --repair-indexes archive --feeds feeds; then
              echo "::error::could not repair missing feed index records; refusing to run"
              exit 1
            fi
            python -m src.md_archive --reconcile-indexes archive --feeds feeds
            python - <<'PY'
          from pathlib import Path

          from src import md_archive
          from src.article_state import article_archive_ref, load_articles, save_articles

          root = Path("archive")
          articles = load_articles()
          cleared = 0
          for article in articles:
              ref = article_archive_ref(article)
              if not ref:
                  continue
              path = Path(ref["path"])
              if path.parts and path.parts[0] == "archive":
                  path = Path(".") / path
              try:
                  md_archive.read_record(path, ref["offset"], ref["length"])
              except (OSError, ValueError):
                  for field in (
                      "archive_file",
                      "archive_offset",
                      "archive_length",
                      "archive_body_len",
                      "archive_sha256",
                  ):
                      article.pop(field, None)
                  article["status"] = "pending"
                  cleared += 1
          if cleared:
              save_articles(articles)
              print(f"::warning::cleared {cleared} stale archive reference(s)")
          PY
          fi

          python - <<'PY'
          import sys
          from pathlib import Path

          from src import md_archive

          indexes = sorted(Path("feeds").glob("*.jsonl")) if Path("feeds").is_dir() else []
          errors = []
          for path in indexes:
              try:
                  header, _records = md_archive.read_feed_index(path)
              except (OSError, ValueError) as exc:
                  errors.append(f"{path}: {exc}")
                  continue
              if not header or header.get("kind") != "feed":
                  errors.append(f"{path}: missing feed header")
          # Defense in depth: validate the archive through the module directly
          # as well, so a missing/broken CLI cannot silently skip the check.
          errors.extend(md_archive.validate_archive("archive"))
          if errors:
              for error in errors:
                  print(f"::error::invalid runtime artifact: {error}")
              sys.exit(1)
          print(f"feed indexes: {len(indexes)} valid; archive validated")
          PY

          # Reaching this point means restore, optional migration and archive
          # validation all completed safely. Snapshot/cache steps require it.
          touch .restore-data-ok
          echo "Runtime restore validated"

      - name: Fetch RSS
        run: python -m src.main --fetch

      - name: Classify articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.main --classify

      - name: Cleanup old articles
        run: python -m src.main --cleanup

      - name: Generate run report
        if: always()
        run: python -m src.main --report

      # The archive is the source of truth. Render it directly to a static
      # site (day pages, per-feed pages and JSON Feeds); Jekyll is no longer
      # involved and gh-pages is not written by the workflow.
      - name: Render archive site
        run: >
          python -m src.render --site _site --archive archive --feeds feeds
          --base-url "${{ vars.PAGES_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}"

      # status.json is a derived counts/warnings report with no secrets. Publish
      # it alongside the site so operators can inspect run health over HTTPS.
      - name: Publish derived health document
        run: |
          set -euo pipefail
          if [ -f status.json ]; then
            cp status.json _site/health.json
            echo "Published _site/health.json"
          else
            echo "::warning::status.json is missing; skipping health.json"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

      # Run after deploy so a backlog/freshness contract breach alerts the
      # maintainer without blocking publication of already-valid content.
      - name: Verify runtime contract
        if: always()
        run: python -m src.main --check

      # Stage a validated copy for the immutable Actions cache. Missing or
      # corrupt runtime files are skipped with a warning: a partial cache must
      # never become the next run's hot state.
      - name: Prepare runtime cache
        id: prepare-runtime-cache
        if: always()
        run: |
          set -euo pipefail
          rm -f .cache-save-ok
          echo "ok=false" >> "$GITHUB_OUTPUT"
          rm -rf .runtime
          mkdir -p .runtime

          validate_json() {
            python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$1"
          }
          has_daily_archive() {
            [ -n "$(find archive -type f -name '*.md' -print -quit 2>/dev/null)" ]
          }

          if [ ! -f .restore-data-ok ]; then
            echo "::warning::runtime restore did not succeed; skipping cache save"
            exit 0
          fi
          if [ ! -f feed_state.json ] || [ ! -f article_state.json ]; then
            echo "::warning::feed_state.json or article_state.json is missing; skipping cache save"
            exit 0
          fi
          if [ ! -f output/index.md ]; then
            echo "::warning::output/index.md is missing; skipping cache save"
            exit 0
          fi
          for f in feed_state.json article_state.json; do
            if ! validate_json "$f"; then
              echo "::warning::$f is not valid JSON; skipping cache save"
              exit 0
            fi
          done

          mkdir -p archive feeds
          if has_daily_archive && [ -z "$(find feeds -type f -name '*.jsonl' -print -quit 2>/dev/null)" ]; then
            echo "::warning::archive has articles but feeds/ is empty; skipping cache save"
            exit 0
          fi

          if [ -d archive ]; then
            if ! python -m src.md_archive --repair archive >/dev/null; then
              echo "::warning::archive tail repair reported an error"
            fi
            if ! python -m src.md_archive --validate archive; then
              echo "::warning::Markdown archive is invalid; skipping cache save"
              exit 0
            fi
          fi

          if ! python - <<'PY'
          import sys
          from pathlib import Path

          from src import md_archive

          indexes = sorted(Path("feeds").glob("*.jsonl")) if Path("feeds").is_dir() else []
          for path in indexes:
              try:
                  header, _records = md_archive.read_feed_index(path)
              except (OSError, ValueError) as exc:
                  print(f"::warning::invalid feed index {path}: {exc}")
                  sys.exit(1)
              if not header or header.get("kind") != "feed":
                  print(f"::warning::invalid feed index {path}: missing feed header")
                  sys.exit(1)
          archive_errors = md_archive.validate_archive("archive")
          if archive_errors:
              for error in archive_errors:
                  print(f"::warning::invalid archive record: {error}")
              sys.exit(1)
          print(f"feed indexes: {len(indexes)} valid; archive validated")
          PY
          then
            echo "::warning::feed indexes are invalid; skipping cache save"
            exit 0
          fi

          # article_state.json is metadata-only. Strip any legacy raw body
          # fields before they can enter the cache (and later the data branch).
          python - <<'PY'
          import json
          from pathlib import Path

          from src.article_state import save_articles

          path = Path("article_state.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          if isinstance(data, dict):
              rows = data.get("articles")
          elif isinstance(data, list):
              rows = data
          else:
              rows = None
          if not isinstance(rows, list):
              raise SystemExit("article_state.json has no articles array")
          cleaned = []
          leaked = 0
          for item in rows:
              if not isinstance(item, dict):
                  continue
              if item.get("content") or "content_length" in item:
                  leaked += 1
              cleaned.append(
                  {
                      key: value
                      for key, value in item.items()
                      if key not in ("content", "content_length")
                  }
              )
          if leaked:
              save_articles(cleaned, "article_state.json")
              print(f"::warning::stripped raw bodies from {leaked} cache articles")
          PY

          # status.json is a derived report only; it is intentionally not
          # cached so a stale status can never be treated as durable state.
          cp feed_state.json article_state.json .runtime/
          cp -R output .runtime/output
          cp -R archive .runtime/archive
          cp -R feeds .runtime/feeds

          touch .cache-save-ok
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "Prepared runtime cache"

      - name: Save runtime cache
        if: always() && steps.prepare-runtime-cache.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .runtime
          key: rss-runtime-${{ github.run_id }}-${{ github.run_attempt }}

      # The data branch is the durable archive. archive/ and feeds/ are
      # append-only and preserved from the remote branch; state/articles are
      # replaced by this run. output/ is no longer preserved or written. A
      # normal fast-forward push is used so a human commit on data is never
      # silently overwritten.
      - name: Snapshot archive to data branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT_FORCED: ${{ github.event.inputs.snapshot || 'false' }}
        run: |
          set -euo pipefail
          validate_json() {
            python -c 'import json,sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$1"
          }
          has_daily_archive() {
            [ -n "$(find archive -type f -name '*.md' -print -quit 2>/dev/null)" ]
          }

          if [ ! -f .restore-data-ok ]; then
            echo "::warning::runtime restore did not succeed; skipping data snapshot"
            exit 0
          fi
          if [ ! -f .cache-save-ok ]; then
            echo "::warning::runtime artifacts were not validated for cache; skipping data snapshot"
            exit 0
          fi
          if [ ! -f feed_state.json ] || [ ! -f article_state.json ]; then
            echo "::warning::feed_state.json or article_state.json is missing; skipping data snapshot"
            exit 0
          fi
          if ! validate_json feed_state.json || ! validate_json article_state.json; then
            echo "::warning::runtime files are not valid JSON; skipping data snapshot"
            exit 0
          fi

          # Fail closed on archive corruption: repair incomplete tails first,
          # then refuse to publish if framing/checksums are still wrong.
          if [ -n "$(find archive -type f -name '*.md' -print -quit 2>/dev/null)" ]; then
            if ! python -m src.md_archive --repair archive; then
              echo "::warning::archive tail repair reported an error"
            fi
            if ! python -m src.md_archive --validate archive; then
              echo "::error::Markdown archive is invalid; refusing to snapshot"
              exit 1
            fi
          else
            echo "::warning::no daily Markdown archive; snapshot will contain metadata only"
          fi

          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf .data-push

          data_existed=false
          if git clone --depth 1 --branch data "$REMOTE" .data-push 2>/dev/null; then
            data_existed=true
            echo "Cloned existing data branch"
          elif DATA_HEADS="$(git ls-remote --heads "$REMOTE" data 2>/dev/null)" && [ -z "$DATA_HEADS" ]; then
            echo "data branch does not exist; creating it"
            rm -rf .data-push
            mkdir -p .data-push
            git -C .data-push init -q
            git -C .data-push checkout -q --orphan data
            git -C .data-push remote add origin "$REMOTE"
          else
            echo "::error::data branch exists but could not be cloned"
            exit 1
          fi

          snapshot_due=false
          if [ "$data_existed" != true ]; then
            snapshot_due=true
          elif [ "$SNAPSHOT_FORCED" = "true" ]; then
            snapshot_due=true
            echo "Snapshot forced by workflow_dispatch input"
          else
            # Only snapshot commits drive the cadence. A human commit on data
            # (or a retried/partial push) must not reset the 20h timer.
            last_epoch="$(git -C .data-push log -1 --grep='^data: snapshot ' --format=%ct)"
            if [ -z "$last_epoch" ] \
              && [ "$(git -C .data-push rev-parse --is-shallow-repository 2>/dev/null || echo false)" = "true" ]; then
              # The depth-1 clone may hide the last snapshot behind a human
              # commit; deepen a bounded amount to find it.
              git -C .data-push fetch --deepen=50 origin || true
              last_epoch="$(git -C .data-push log -1 --grep='^data: snapshot ' --format=%ct)"
            fi
            if [ -z "$last_epoch" ]; then
              snapshot_due=true
              echo "No prior 'data: snapshot' commit; snapshot is due"
            else
              now_epoch="$(date -u +%s)"
              age=$(( now_epoch - last_epoch ))
              if [ "$age" -ge 72000 ]; then
                snapshot_due=true
                echo "Last data snapshot is ${age}s old; due"
              else
                echo "Last data snapshot is ${age}s old; not due"
              fi
            fi
          fi

          if [ "$snapshot_due" != true ]; then
            echo "No data snapshot this run"
            rm -rf .data-push
            exit 0
          fi

          # Replace the managed metadata files but preserve remote append-only
          # trees. Local copies are then written over them without deleting
          # remote files, so a stale cache cannot shrink the archive. The
          # cleanup also removes legacy state.json/articles.json/status.json
          # and the stale output/ tree; status.json is derived and must never
          # be snapshotted.
          find .data-push -mindepth 1 -maxdepth 1 \
            ! -name .git ! -name archive ! -name feeds -exec rm -rf {} +
          rm -f .data-push/state.json .data-push/articles.json .data-push/status.json
          mkdir -p .data-push/archive .data-push/feeds

          # Append-only trees may only grow. Refuse to overwrite a longer
          # remote file with a shorter/stale local copy (e.g. after a failed
          # cache save or a partial restore). Missing local files are simply
          # left as remote-only; remote files are never deleted.
          python - <<'PY'
          import sys
          from pathlib import Path

          allow_feed_reconcile = Path(".cache-restore-miss").exists()
          for tree in ("archive", "feeds"):
              remote_root = Path(".data-push") / tree
              local_root = Path(tree)
              if not local_root.is_dir():
                  continue
              if tree == "feeds" and allow_feed_reconcile:
                  # A cold start may have reconciled stale offsets and
                  # intentionally dropped invalid feed records. Archive files
                  # are still prefix-checked below/above.
                  continue
              for local in local_root.rglob("*"):
                  if not local.is_file():
                      continue
                  remote = remote_root / local.relative_to(local_root)
                  if not remote.is_file():
                      continue
                  remote_bytes = remote.read_bytes()
                  local_bytes = local.read_bytes()
                  if not local_bytes.startswith(remote_bytes):
                      sys.exit(
                          f"refusing to shrink {remote}: local copy is not an "
                          "append-only extension of the data branch"
                      )
          PY

          if [ -d archive ]; then
            cp -R archive/. .data-push/archive/
          fi
          if [ -d feeds ]; then
            cp -R feeds/. .data-push/feeds/
          fi
          # Pin LF for archive/feeds so byte offsets survive checkout. The data
          # branch is orphan, so it does not inherit main's .gitattributes.
          if [ -f .gitattributes ]; then
            cp .gitattributes .data-push/.gitattributes
          fi
          # output/ is a stale derived summary and is no longer written to the
          # data branch. status.json is not copied: it is a derived report, not
          # durable state.
          cp feed_state.json .data-push/feed_state.json
          cp article_state.json .data-push/article_state.json
          rm -f .data-push/state.json .data-push/articles.json .data-push/status.json

          # The old ADR-016 archive was a flat archive/YYYY-MM-DD.jsonl.
          # Its metadata is superseded by the Markdown archive; keep only the
          # permanent archive/YYYY/MM/DD.md tree.
          find .data-push/archive -maxdepth 1 -type f -name '*.jsonl' -delete

          # Fail closed if the snapshot leaks bodies, contains unexpected
          # paths, or has archive/feeds inconsistencies.
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          from src import md_archive

          root = Path(".data-push")
          allowed = {".gitattributes", "feed_state.json", "article_state.json", "archive", "feeds"}
          entries = {p.name for p in root.iterdir() if p.name != ".git"}
          extra = entries - allowed
          if extra:
              sys.exit(f"unexpected paths in data snapshot: {sorted(extra)}")

          for name in ("feed_state.json", "article_state.json"):
              path = root / name
              if not path.is_file():
                  sys.exit(f"missing {name} in data snapshot")
              data = json.loads(path.read_text(encoding="utf-8"))
              if name == "feed_state.json":
                  if not isinstance(data, dict):
                      sys.exit("feed_state.json is not a JSON object")
              else:
                  # Accept the versioned object and, defensively, a legacy
                  # bare list. Raw bodies are read from the article rows.
                  if isinstance(data, dict):
                      rows = data.get("articles")
                  elif isinstance(data, list):
                      rows = data
                  else:
                      rows = None
                  if not isinstance(rows, list):
                      sys.exit("article_state.json has no articles array")
                  leaked = [
                      item for item in rows
                      if isinstance(item, dict)
                      and (item.get("content") or item.get("content_length"))
                  ]
                  if leaked:
                      sys.exit(
                          f"raw content found in {len(leaked)} snapshot articles; "
                          "refusing to push"
                      )
              print(f"{name}: ok")

          # status.json is a derived report and output/ is a stale derived
          # summary. The cleanup above deletes remote copies; refuse to push if
          # either somehow reappears (the allowlist check also catches output/).
          if (root / "status.json").exists():
              sys.exit("status.json must not be part of the data snapshot")
          if (root / "output").exists():
              sys.exit("output/ must not be part of the data snapshot")

          # Repair only incomplete tails on the combined remote+local archive.
          # src.md_archive does not have a Python "repair then validate" entry
          # point that returns diagnostics, so run the CLI-equivalent steps in
          # order via subprocess for a single failure message.
          import subprocess

          archive_dir = root / "archive"
          if archive_dir.exists():
              subprocess.run(
                  [sys.executable, "-m", "src.md_archive", "--repair", str(archive_dir)],
                  check=False,
              )
              errors = md_archive.validate_archive(archive_dir)
              if errors:
                  sys.exit("invalid archive records: " + "; ".join(errors[:5]))
          else:
              print("::warning::archive/ not present in snapshot")

          daily = list((root / "archive").rglob("*.md")) if archive_dir.exists() else []
          indexes = list((root / "feeds").glob("*.jsonl")) if (root / "feeds").is_dir() else []
          for path in indexes:
              try:
                  header, _records = md_archive.read_feed_index(path)
              except (OSError, ValueError) as exc:
                  sys.exit(f"invalid feed index {path}: {exc}")
              if not header or header.get("kind") != "feed":
                  sys.exit(f"invalid feed index {path}: missing feed header")
          if daily and not indexes:
              sys.exit("archive contains articles but feeds/ has no indexes")
          if indexes and not daily:
              print("::warning::feeds/ indexes exist but archive has no daily files")
          print(f"snapshot: {len(daily)} daily file(s), {len(indexes)} feed index(es)")
          PY

          git -C .data-push config user.name "github-actions[bot]"
          git -C .data-push config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C .data-push add -A
          if git -C .data-push diff --cached --quiet; then
            echo "No data snapshot changes"
            rm -rf .data-push
            exit 0
          fi

          git -C .data-push commit -q -m "data: snapshot $(date -u +%Y-%m-%d)"
          if ! git -C .data-push push origin data; then
            echo "::warning::data push rejected; rebasing once and retrying"
            # The clone is shallow (depth=1). Unshallow first so a remote that
            # advanced by more than one commit can still be rebased.
            git -C .data-push fetch --unshallow origin data || true
            # Note: a concurrent human commit that touches feed_state.json /
            # article_state.json usually conflicts here. That is intentional: the
            # retry then fails instead of overwriting the remote branch.
            git -C .data-push pull --rebase origin data
            git -C .data-push push origin data
          fi
          echo "Pushed data snapshot $(date -u +%Y-%m-%d)"
          rm -rf .data-push
